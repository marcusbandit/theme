# GREENSTEEL - cool anodised-green metal
#
# The original design system from ~/.config/hypr/DESIGN.md, ported to the
# shared colors.toml format. The ANSI 16 below is DESIGN.md section 7 verbatim,
# which was already contrast audited against the background.
#
# Valid Omarchy 4.x theme. See themes/slate/colors.toml for the key contract.

mode = "dark"

### ---- Omarchy standard keys -------------------------------------------------

darker_background  = "#040706"
dark_background    = "#070C0A"
background         = "#0D1512"
lighter_background = "#1B2A23"
selection          = "#22322B"
muted              = "#33493F"

dark_foreground    = "#4C6B5C"
foreground         = "#C9E2D7"
light_foreground   = "#EAF6F0"
bright_foreground  = "#F7FDFA"

accent             = "#5FD99A"

red                = "#E06B7A"
green              = "#5FD99A"
yellow             = "#D8C48C"
blue               = "#6FA9C7"
magenta            = "#B08CC9"
cyan               = "#5FF2C4"

bright_red         = "#FF8C99"
bright_green       = "#8CFFC0"
bright_yellow      = "#F0DCA6"
bright_blue        = "#93C8E2"
bright_magenta     = "#CBA8E0"
bright_cyan        = "#93FFDF"

orange             = "#FF6B3D"
brown              = "#7F351E"

### ---- Design-system extensions (theme-neutral names) ------------------------

ramp_void        = "#070C0A"
ramp_abyss       = "#0D1512"
ramp_dark        = "#16211C"
ramp_plate       = "#1B2A23"
